<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WNMU Home</title>
  <meta name="description" content="Home portal for WNMU programming, pledge, and monthly schedule tools.">
  <link rel="stylesheet" href="styles.css?v=v1.0.3-r2026-06-10">
</head>
<body>
  <main class="portal-shell">
    <header class="hero">
      <div class="hero-brand">
        <img class="hero-logo" src="https://raw.githubusercontent.com/tpoirier1969/WNMU-Programming-library/main/WNMU-TV-logo-head2019.png" alt="WNMU-TV official logo">
        <div class="hero-copy">
          <p class="kicker">WNMU tools portal</p>
          <h1>WNMU Home</h1>
        </div>
      </div>
      <div class="version-pill" aria-label="Portal version">
        <span>Portal</span>
        <strong>v1.0.3-r2026-06-10</strong>
      </div>
    </header>

    <section class="app-grid" data-app-grid aria-label="WNMU apps">
      <noscript><p class="noscript-warning">JavaScript is needed to build the app launcher buttons.</p></noscript>
    </section>

    <section class="drive-summary-panel hidden" id="pledgeDriveSummary" aria-live="polite" aria-label="Current pledge drive summary"></section>

    <section class="workflow-panel" aria-label="Portal notes">
      <h2>Current approach</h2>
      <p>This is a launcher only. It does not merge data, rewrite app logic, or change the existing WNMU tools.</p>
    </section>

    <footer class="portal-footer" aria-label="Project links">
      <h2>Project links</h2>
      <div class="footer-links">
        <a href="https://github.com/tpoirier1969/WNMU-Programming-library" target="_blank" rel="noopener noreferrer">Programming Library repo</a>
        <a href="https://github.com/tpoirier1969/WNMU-Fundraising-library-and-data" target="_blank" rel="noopener noreferrer">Pledge Library repo</a>
        <a href="https://github.com/tpoirier1969/WNMU-monthly-schedules" target="_blank" rel="noopener noreferrer">Monthly Schedules repo</a>
        <a href="https://github.com/tpoirier1969/WNMU-Home" target="_blank" rel="noopener noreferrer">WNMU Home repo</a>
      </div>
    </footer>
  </main>
  <script src="app.js?v=v1.0.3-r2026-06-10"></script>
</body>
</html>
