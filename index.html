<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WNMU Home</title>
  <meta name="description" content="Home portal for WNMU programming, pledge, and monthly schedule tools.">
  <link rel="stylesheet" href="styles.css?v=v1.0.14-r2026-06-11">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#17345f">
</head>
<body>
  <main class="portal-shell">
    <header class="hero">
      <div class="hero-brand">
        <img class="hero-logo" src="https://raw.githubusercontent.com/tpoirier1969/WNMU-Programming-library/main/WNMU-TV-logo-head2019.png" alt="WNMU-TV official logo">
        <div class="hero-copy">
          <p class="kicker">WNMU tools portal</p>
          <h1>WNMU Home</h1>
        </div>
      </div>
      <div class="hero-actions">
        <button type="button" class="login-placeholder-button" aria-label="Login placeholder">Log in</button>
        <div class="version-pill" aria-label="Portal version">
          <span>Portal</span>
          <strong>v1.0.14-r2026-06-11</strong>
        </div>
      </div>
    </header>

    <section class="app-grid" data-app-grid aria-label="WNMU apps">
      <noscript><p class="noscript-warning">JavaScript is needed to build the app launcher buttons.</p></noscript>
    </section>

    <section class="drive-summary-panel hidden" id="pledgeDriveSummary" aria-live="polite" aria-label="Current pledge drive summary"></section>

    <section class="schedule-panel hidden" id="homeScheduleSummary" aria-live="polite" aria-label="WNMU 13.1 schedule summary"></section>
  </main>

  <script src="app.js?v=v1.0.14-r2026-06-11"></script>
</body>
</html>
